name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Export debug APK
        run: |
          mkdir -p build
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/client \
            barichello/godot-ci:4.3 \
            bash -lc 'bash /workspace/.github/export-android.sh'

      - uses: actions/upload-artifact@v4
        with:
          name: ufacity-debug-apk
          path: build/ufacity-debug.apk
          if-no-files-found: error
